# Full stack: MongoDB (single-node replica set, so wallet/payment transactions
# work), the API, and the web app (nginx serving the SPA and proxying /api).
#   docker compose up --build        -> http://localhost:8080
#   docker compose run --rm seed     -> load demo data (DEVELOPMENT ONLY)
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\""]
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/scrapmate?replicaSet=rs0
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      SOCKET_CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: 1
      # Override with a long random value (required in production).
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32-chars}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  seed:
    build: ./backend
    profiles: ["tools"]
    command: ["node", "src/seed/seed.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/scrapmate?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
